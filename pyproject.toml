[build-system]
requires = ["setuptools>=77,<91", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "blip-desktop"
dynamic = ["version", "dependencies"]
description = "A little Sun Wukong desktop tray companion"
readme = "readme.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tahashibur Rahman"}]
keywords = ["desktop-pet", "tkinter", "pystray", "sun-wukong", "desktop-companion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/TahashiburRahman/blip"
Repository = "https://github.com/TahashiburRahman/blip"
Issues = "https://github.com/TahashiburRahman/blip/issues"
Changelog = "https://github.com/TahashiburRahman/blip/blob/main/CHANGELOG.md"

[project.gui-scripts]
blip = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "main.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".tools", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"Blip.spec" = ["F821"]
