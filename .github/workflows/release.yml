name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check tag matches application version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -c "import os, main; assert os.environ['RELEASE_TAG'] == 'v' + main.__version__, 'Tag must match main.__version__'"
      - name: Lint and unit tests
        run: |
          python -m ruff check .
          python -m unittest discover -v
      - name: Build and validate Python distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Build desktop application
        run: python scripts/build.py
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blip-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Blip-v*.zip
            dist/Blip-v*.tar.gz
            dist/*.whl
            dist/blip_desktop-*.tar.gz

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-files
          merge-multiple: true
      - name: Write checksums and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd release-files
          sha256sum * > SHA256SUMS
          cd ..
          python3 scripts/release_notes.py "${RELEASE_TAG#v}" release-notes.md
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Blip $RELEASE_TAG" --notes-file release-notes.md release-files/*
